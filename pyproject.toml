[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rcor-nuclear"
version = "0.1.0"
description = "Riemannian Co-Registration of SPD matrices with nuclear-norm sign optimization"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]
